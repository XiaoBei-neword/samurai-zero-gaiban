<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>角色美术检查</title>
<style>
  html,body{margin:0;background:#07060f;overflow:hidden;cursor:none}
  canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import { drawSamurai, drawRonin, drawGunner, drawShield, drawGroundShadow, drawSlashArc } from '../../src/core/sprites.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function bg() {
  // 模拟游戏里的地面与背景亮度：上面板暗、地板亮
  const g = ctx.createLinearGradient(0, 0, 0, 720);
  g.addColorStop(0, '#120f22');
  g.addColorStop(0.55, '#0b0918');
  g.addColorStop(1, '#07050f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1280, 720);
  // 一块"平台"
  ctx.fillStyle = '#120e1c';
  ctx.fillRect(0, 560, 1280, 160);
  ctx.fillStyle = 'rgba(150,140,200,0.30)';
  ctx.fillRect(0, 560, 1280, 2);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = '#22e0ff';
  ctx.fillRect(0, 559, 1280, 2);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  // 网格刻度，方便判断尺寸
  ctx.strokeStyle = 'rgba(90,80,140,0.18)';
  ctx.lineWidth = 1;
  for (let x = 0; x < 1280; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 560); ctx.stroke(); }
  for (let y = 560; y > 0; y -= 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1280, y); ctx.stroke(); }
}

function label(text, x, y) {
  ctx.save();
  ctx.font = '11px Consolas, monospace';
  ctx.fillStyle = 'rgba(180,220,255,0.65)';
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y);
  ctx.restore();
}

const S = 2.0; // 放大 2 倍看细节
let t = 0;

function frame() {
  t += 1 / 60;
  bg();

  // ---------- 玩家：6 个状态 ----------
  const pStates = [
    ['idle', {}],
    ['run', {}],
    ['jump', {}],
    ['fall', {}],
    ['dash', {}],
    ['slash', { slash: { angle: -0.35, t01: 0.4 } }],
  ];
  pStates.forEach(([st, extra], i) => {
    const x = 110 + i * 190;
    ctx.save();
    ctx.translate(x, 520);
    ctx.scale(S, S);
    drawSamurai(ctx, {
      x: 0, y: 0, facing: 1, state: st, animT: t + i * 0.3,
      vx: st === 'run' ? 340 : 0, vy: st === 'fall' ? 400 : st === 'jump' ? -300 : 0,
      slow: st === 'slash' ? 0.6 : 0,
      h: 52, ...extra,
    });
    ctx.restore();
    label(`player:${st}`, x, 545);
  });

  // ---------- 玩家在减缓状态 ----------
  ctx.save();
  ctx.translate(150, 690);
  ctx.scale(S, S);
  drawSamurai(ctx, { x: 0, y: 0, facing: 1, state: 'run', animT: t, slow: 1, h: 52 });
  ctx.restore();
  label('player:slow-motion', 150, 712);

  // ---------- 三个敌人 ----------
  const ex = 470;
  ctx.save();
  ctx.translate(ex, 520);
  ctx.scale(S, S);
  drawRonin(ctx, { x: 0, y: 0, facing: 1, state: 'windup', animT: t, windup: 0.65, h: 56 });
  ctx.restore();
  label('ronin:windup', ex, 545);

  ctx.save();
  ctx.translate(ex + 210, 520);
  ctx.scale(S, S);
  drawGunner(ctx, { x: 0, y: 0, facing: 1, state: 'aim', animT: t, aimAngle: 0.05, h: 54 });
  ctx.restore();
  label('gunner:aim', ex + 210, 545);

  ctx.save();
  ctx.translate(ex + 430, 520);
  ctx.scale(S, S);
  drawShield(ctx, { x: 0, y: 0, facing: 1, state: 'chase', animT: t, shieldUp: 1, h: 62 });
  ctx.restore();
  label('shield:chase', ex + 430, 545);

  // ---------- 刀光 ----------
  ctx.save();
  ctx.translate(1000, 430);
  ctx.scale(1.4, 1.4);
  drawSlashArc(ctx, 0, 0, 78, -0.5, 1.082, 0.45, 'rgba(255,255,255,0.95)', 'rgba(150,240,255,0.7)');
  ctx.restore();
  label('slash arc', 1000, 545);

  // ---------- 大图：玩家 4x ----------
  ctx.save();
  ctx.translate(1100, 700);
  ctx.scale(4, 4);
  drawSamurai(ctx, { x: 0, y: 0, facing: -1, state: 'idle', animT: t, h: 52 });
  ctx.restore();
  label('player 4x', 1100, 715);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__CHARS_READY__ = true;
</script>
</body>
</html>
